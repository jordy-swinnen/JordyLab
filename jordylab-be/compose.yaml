# Local dev infra only: the Postgres + pgvector container. The backend itself runs via `./gradlew bootRun`
# and authenticates with its own accounts (spec 019); there is no identity container.
#
# The artwork directory is a host filesystem path (no compose volume here) — in
# dev, point `GAMECATALOG_ARTWORK_DIR` at a local dir like `/tmp/jordylab-artwork`.
# In prod (k3s on the OVH VPS), the same env var points at the backend's
# PersistentVolumeClaim so uploaded artwork survives restarts.
services:
  pgvector:
    image: 'pgvector/pgvector:pg16'
    environment:
      - 'POSTGRES_DB=jordylab'
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
    labels:
      - "org.springframework.boot.service-connection=postgres"
    ports:
      - '5432:5432'
    volumes:
      # A NAMED volume on purpose. Without it the image's own anonymous volume holds the data, and it is lost for good when
      # the container is removed (`rm -v`, `compose down -v`, a prune): that is how the dev database vanished before.
      # A named volume survives `compose down` and container removal; only `compose down -v` or `volume rm jordylab-be_pgdata` deletes it.
      - 'pgdata:/var/lib/postgresql/data'

volumes:
  pgdata:
