# JordyLab login theme. Inherits Keycloak's v2 (PatternFly 5) login theme and only restyles it; no FreeMarker templates are
# overridden, so upgrades stay cheap.
parent=keycloak.v2
import=common/keycloak

# Follow the device: Keycloak's v2 template toggles PatternFly's dark class from prefers-color-scheme. jordylab.css selects its two
# palettes (Content Led dark, Paper light) with prefers-color-scheme itself, so it does not depend on that class.
darkMode=true
kcHtmlClass=login-pf

styles=css/styles.css css/jordylab.css
