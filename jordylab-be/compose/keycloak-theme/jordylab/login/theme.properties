# JordyLab "Night Lab" login theme. Inherits Keycloak's v2 (PatternFly 5) login theme and only
# restyles it; no FreeMarker templates are overridden, so upgrades stay cheap.
parent=keycloak.v2
import=common/keycloak

# Always dark: skip the prefers-color-scheme switch and pin the PatternFly dark class instead.
darkMode=false
kcHtmlClass=login-pf pf-v5-theme-dark

styles=css/styles.css css/jordylab.css
