spring:
  autoconfigure:
    # pgvector's VectorStore needs an EmbeddingModel, which a since-removed local-LLM starter supplied silently.
    # Nothing uses a VectorStore yet (no RAG/semantic search), so it stays off until a feature needs it: then remove
    # this exclusion and configure an embedding model (spec 011 BUG-009; see AGENTS.md → Shared Gotchas).
    exclude: org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  application:
    name: jordylab-be
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER:jordylab}
    password: ${POSTGRES_PASSWORD:}
  session:
    jdbc:
      # Sessions live in the identity schema (spec 019): Flyway creates the tables, Spring Session never does.
      initialize-schema: never
      # Unquoted, Postgres folds this to identity.spring_session (and identity.spring_session_attributes).
      table-name: identity.SPRING_SESSION
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  threads:
    virtual:
      enabled: true
  http:
    clients:
      connect-timeout: 10s
      # Backstop for jordylab.ai.call-timeout-seconds: interrupting the worker thread on
      # Future timeout doesn't guarantee the underlying Reactor Netty exchange is torn down
      # (Mono.block() under ReactorClientHttpRequestFactory), so the HTTP client itself also
      # bounds the call. Applies to every RestClient built from the shared builder, including
      # Spring AI's AnthropicApi and StockPriceService's Yahoo Finance client.
      read-timeout: 120s
  ai:
    # The connector's MCP server (spec 021): stateless Streamable HTTP at /mcp, tools only (research R1).
    mcp:
      server:
        name: jordylab
        type: SYNC
        protocol: STATELESS
        annotation-scanner:
          enabled: true
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
    # Chat and embeddings are used (LibBot's semantic index embeds through the same OpenRouter gateway, spec 013 research A3);
    # keep the OpenAI starter's other clients (image, audio, moderation) out of the context.
    model:
      embedding: openai
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    # Both chat models are needed: OpenRouter (OpenAI-compatible) is the primary, Anthropic the fallback. Leave
    # spring.ai.model.chat unset — each starter only matches its own value there, so setting it switches the other off.
    openai:
      base-url: ${jordylab.ai.gateway.base-url}
      embedding:
        options:
          # Not selectable on Settings → AI Models: switching it invalidates every stored vector (GameEmbedding stores the model).
          # 1536 matches the vector(1536) column and the project's pgvector rule.
          model: ${jordylab.ai.embedding.model}
          dimensions: 1536
      # The OpenAI auto-configuration refuses to start without a key; "unset" keeps it up, and ResilientAiService
      # skips the gateway while jordylab.ai.gateway.api-key is blank.
      api-key: ${OPENROUTER_API_KEY:unset}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-5
          max-tokens: 8192

server:
  servlet:
    session:
      # Sessions survive restarts and rolling deploys (spec 019 SC-003). The cookie is persistent with the
      # same idle window; HttpOnly and SameSite=Lax are Boot defaults, secure is set in the prod profile.
      timeout: 30d
      cookie:
        max-age: 30d
  error:
    # /error is reachable now (IdentitySecurityConfiguration permits DispatcherType.ERROR), so never expose
    # internals in it.
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

info:
  commit: ${JORDYLAB_GIT_COMMIT:unknown}

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        # The exporter is ours (LangfuseTracingConfiguration, AI spans only); the default one would post to localhost.
        enabled: false
  opentelemetry:
    resource-attributes:
      "[deployment.environment.name]": ${LANGFUSE_ENVIRONMENT:local}

# AI traces go to Langfuse (OpenTelemetry). No keys, no export. Prompts and answers are only added to the traces with
# LANGFUSE_CAPTURE_CONTENT=true (see shared/ai/AGENTS.md).
langfuse:
  public-key: ${LANGFUSE_PUBLIC_KEY:}
  secret-key: ${LANGFUSE_SECRET_KEY:}
  base-url: ${LANGFUSE_BASE_URL:https://cloud.langfuse.com}
  capture-content: ${LANGFUSE_CAPTURE_CONTENT:false}

jordylab:
  mcp:
    # The connector's public origin and OAuth issuer; the protected resource is <origin>/mcp. Same variable as the
    # notifications' click-through origin.
    public-base-url: ${JORDYLAB_APP_BASE_URL:}
    audience: jordylab-mcp
    tool-calls-per-minute: 60
    # Access tokens are short-lived; the rotating refresh token keeps Claude connected across a deploy.
    access-token-ttl: 10m
    refresh-token-ttl: 30d
  ai:
    health-check-ttl-seconds: 30
    call-timeout-seconds: 120
    gateway:
      # Keep /v1: the official openai-java SDK appends /chat/completions itself (006 research §1.1).
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      api-key: ${OPENROUTER_API_KEY:}
    fallback:
      provider: anthropic
      model: claude-sonnet-5
    embedding:
      model: openai/text-embedding-3-small
    # Feature keys contain dots: the brackets keep them whole instead of nesting (AiPropertiesTest).
    features:
      "[fna.briefing]":
        model: anthropic/claude-sonnet-5
      "[gamecatalog.enrichment]":
        model: anthropic/claude-haiku-4.5
      # Temperature 0: the question reader must give the same facts for the same question (spec 013 research A1).
      "[gamecatalog.chat.query]":
        model: anthropic/claude-haiku-4.5
        temperature: 0
      "[gamecatalog.chat.answer]":
        model: anthropic/claude-haiku-4.5
        temperature: 0.3
  gamecatalog:
    artwork:
      dir: ${GAMECATALOG_ARTWORK_DIR:/var/jordylab/artwork}
      max-bytes: 2097152
      external-lookup-enabled: true
      lookup-timeout-ms: 2000
    grace-period-days: 30
    enrichment:
      batch-size: 8
      max-attempts: 3
    chat:
      max-result-games: 50
    # Background auto-fill of covers, facts, descriptions and the search index (spec 013 US4).
    autofill:
      batch-size: 10
      ai-max-attempts: 3
      free-lookup-retry-hours: 24
      sweep-cron: "0 30 4 * * *"
      zone: Europe/Brussels
    # LibBot (spec 013 US1 to US3).
    libbot:
      memory-exchanges: 10
      memory-idle-hours: 2
      max-references: 10
      max-candidates: 15
      max-unknown-titles: 5
      max-message-length: 1000
    metadata:
      store-base-url: https://store.steampowered.com
      batch-size: 25
      max-attempts: 3
    # Player counts for console games (spec 014). The key is THEGAMESDB_API_KEY; without it the source is skipped.
    thegamesdb:
      base-url: https://api.thegamesdb.net/v1
      timeout-ms: 5000
      min-interval-ms: 1000
      allowance-reserve: 20
    scan:
      max-games-per-source: 50000
      max-payload-bytes: 8388608
      max-manifest-bytes-per-source: 262144
      max-shrink-fraction: 0.5
    library:
      min-interval-minutes: 720
      stale-after-days: 14
      store-min-interval-ms: 1500
      call-timeout-ms: 10000
    guest-chat:
      daily-limit: ${JORDYLAB_GUEST_CHAT_DAILY_LIMIT:20}
      zone: Europe/Brussels
    model-catalog:
      cache-ttl-minutes: 60
  notifications:
    # Admin push click-throughs are built from this origin (spec 018 US3) — prod: https://jordylab.be.
    app-base-url: ${JORDYLAB_APP_BASE_URL:}
    ntfy:
      base-url: ${NTFY_BASE_URL:}
      topic: ${NTFY_TOPIC:}
      token: ${NTFY_TOKEN:}
  # Identity module (spec 019). The bootstrap admin is created only while the account table is empty.
  identity:
    password:
      min-length: 12
    lockout:
      max-failures: 5
      lock-minutes: 15
    bootstrap:
      username: ${IDENTITY_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${IDENTITY_BOOTSTRAP_ADMIN_PASSWORD:}
    webauthn:
      rp-id: ${IDENTITY_WEBAUTHN_RP_ID:localhost}
      rp-name: JordyLab
      allowed-origins: ${IDENTITY_WEBAUTHN_ALLOWED_ORIGINS:http://localhost:4200}
  feedback:
    # 017: the idea box. Five tickets per guest per day, reset at midnight in this zone.
    daily-ticket-limit: ${JORDYLAB_FEEDBACK_DAILY_LIMIT:5}
    daily-limit-zone: Europe/Brussels
    linear:
      base-url: https://api.linear.app/graphql
      # Jordy's personal API key (SOPS secret in prod). Unset means Accept fails fast with LINEAR_UNAVAILABLE.
      api-key: ${LINEAR_API_KEY:}
      team-key: JOR
      connect-timeout-ms: 5000
      read-timeout-ms: 15000
  cors:
    allowed-origins: ${JORDYLAB_CORS_ALLOWED_ORIGINS}
