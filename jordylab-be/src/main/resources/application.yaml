spring:
  application:
    name: jordylab-be
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER:jordylab}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  threads:
    virtual:
      enabled: true
  http:
    clients:
      connect-timeout: 10s
      # Backstop for jordylab.ai.call-timeout-seconds: interrupting the worker thread on
      # Future timeout doesn't guarantee the underlying Reactor Netty exchange is torn down
      # (Mono.block() under ReactorClientHttpRequestFactory), so the HTTP client itself also
      # bounds the call. Applies to every RestClient built from the shared builder, including
      # Spring AI's AnthropicApi and StockPriceService's Yahoo Finance client.
      read-timeout: 120s
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-5
          max-tokens: 8192
  security:
     oauth2:
       resourceserver:
         jwt:
           issuer-uri: ${KEYCLOAK_URL}/realms/jordylab

management:
  endpoints:
    web:
      exposure:
        include: health,info

jordylab:
  ai:
    health-check-ttl-seconds: 30
    call-timeout-seconds: 120
    gateway:
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    fallback:
      provider: anthropic
      model: claude-sonnet-5
    features:
      fna.briefing:
        model: anthropic/claude-sonnet-5
      gamecatalog.enrichment:
        model: anthropic/claude-haiku-4.5
      gamecatalog.chat.query:
        model: anthropic/claude-haiku-4.5
      gamecatalog.chat.answer:
        model: anthropic/claude-haiku-4.5
    modules:
      fna:
        provider: anthropic
        model: claude-sonnet-5
      gamecatalog:
        provider: anthropic
        model: claude-haiku-4-5-20251001
  gamecatalog:
    artwork:
      dir: ${GAMECATALOG_ARTWORK_DIR:/var/jordylab/artwork}
      max-bytes: 2097152
      external-lookup-enabled: true
      lookup-timeout-ms: 2000
    grace-period-days: 30
    enrichment:
      batch-size: 8
      max-attempts: 3
    chat:
      max-result-games: 50
    metadata:
      store-base-url: https://store.steampowered.com
      batch-size: 25
      max-attempts: 3
    scan:
      max-games-per-source: 10000
      max-payload-bytes: 1048576
      max-manifest-bytes-per-source: 262144
      max-shrink-fraction: 0.5
    library:
      min-interval-minutes: 720
      stale-after-days: 14
      store-min-interval-ms: 1500
      call-timeout-ms: 10000
  settings:
    keycloak:
      server-url: ${KEYCLOAK_URL}
      realm: jordylab
      admin-client-id: jordylab-backend
      admin-client-secret: ${KEYCLOAK_BACKEND_SECRET:}
    guest-chat:
      daily-limit: ${JORDYLAB_GUEST_CHAT_DAILY_LIMIT:20}
      zone: Europe/Brussels
    model-catalog:
      cache-ttl-minutes: 60
  mobile:
    release:
      storage-dir: ${MOBILE_RELEASE_STORAGE_DIR:/var/jordylab/mobile-releases}
      # Placeholder until the release keystore is generated (research D14, stop-and-report gate).
      signing-cert-sha256: ${MOBILE_RELEASE_SIGNING_CERT_SHA256:}
    download-link:
      secret: ${MOBILE_DOWNLOAD_LINK_SECRET:}
      ttl-minutes: 5
    app:
      # Placeholders — blocked on feature 008 (production HTTPS deployment) and the application-id
      # decision (research D13/D14, stop-and-report gates).
      package-name: ${MOBILE_APPLICATION_ID:}
      production-domain: ${MOBILE_PRODUCTION_DOMAIN:}
    notifications:
      ntfy:
        base-url: ${NTFY_BASE_URL:}
        topic: ${NTFY_TOPIC:}
        token: ${NTFY_TOKEN:}
  cors:
    allowed-origins: ${JORDYLAB_CORS_ALLOWED_ORIGINS}
