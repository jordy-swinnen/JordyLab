spring:
  autoconfigure:
    # pgvector's VectorStore needs an EmbeddingModel, which a since-removed local-LLM starter supplied silently.
    # Nothing uses a VectorStore yet (no RAG/semantic search), so it stays off until a feature needs it: then remove
    # this exclusion and configure an embedding model (spec 011 BUG-009; see AGENTS.md → Shared Gotchas).
    exclude: org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  servlet:
    multipart:
      # Signed release APKs are uploaded by CI (POST /api/mobile/releases); Spring's 1 MB default rejects them.
      max-file-size: 200MB
      max-request-size: 210MB
  application:
    name: jordylab-be
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER:jordylab}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  threads:
    virtual:
      enabled: true
  http:
    clients:
      connect-timeout: 10s
      # Backstop for jordylab.ai.call-timeout-seconds: interrupting the worker thread on
      # Future timeout doesn't guarantee the underlying Reactor Netty exchange is torn down
      # (Mono.block() under ReactorClientHttpRequestFactory), so the HTTP client itself also
      # bounds the call. Applies to every RestClient built from the shared builder, including
      # Spring AI's AnthropicApi and StockPriceService's Yahoo Finance client.
      read-timeout: 120s
  ai:
    # Only chat is used: keep the OpenAI starter's other clients (embedding, image, audio, moderation) out of the context.
    model:
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    # Both chat models are needed: OpenRouter (OpenAI-compatible) is the primary, Anthropic the fallback. Leave
    # spring.ai.model.chat unset — each starter only matches its own value there, so setting it switches the other off.
    openai:
      base-url: ${jordylab.ai.gateway.base-url}
      # The OpenAI auto-configuration refuses to start without a key; "unset" keeps it up, and ResilientAiService
      # skips the gateway while jordylab.ai.gateway.api-key is blank.
      api-key: ${OPENROUTER_API_KEY:unset}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-5
          max-tokens: 8192
  security:
     oauth2:
       resourceserver:
         jwt:
           issuer-uri: ${KEYCLOAK_URL}/realms/jordylab

server:
  error:
    # /error is reachable now (SecurityConfig permits DispatcherType.ERROR), so never expose internals in it.
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

jordylab:
  ai:
    health-check-ttl-seconds: 30
    call-timeout-seconds: 120
    gateway:
      # Keep /v1: the official openai-java SDK appends /chat/completions itself (006 research §1.1).
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      api-key: ${OPENROUTER_API_KEY:}
    fallback:
      provider: anthropic
      model: claude-sonnet-5
    # Feature keys contain dots: the brackets keep them whole instead of nesting (AiPropertiesTest).
    features:
      "[fna.briefing]":
        model: anthropic/claude-sonnet-5
      "[gamecatalog.enrichment]":
        model: anthropic/claude-haiku-4.5
      "[gamecatalog.chat.query]":
        model: anthropic/claude-haiku-4.5
      "[gamecatalog.chat.answer]":
        model: anthropic/claude-haiku-4.5
  gamecatalog:
    artwork:
      dir: ${GAMECATALOG_ARTWORK_DIR:/var/jordylab/artwork}
      max-bytes: 2097152
      external-lookup-enabled: true
      lookup-timeout-ms: 2000
    grace-period-days: 30
    enrichment:
      batch-size: 8
      max-attempts: 3
    chat:
      max-result-games: 50
    metadata:
      store-base-url: https://store.steampowered.com
      batch-size: 25
      max-attempts: 3
    scan:
      max-games-per-source: 10000
      max-payload-bytes: 1048576
      max-manifest-bytes-per-source: 262144
      max-shrink-fraction: 0.5
    library:
      min-interval-minutes: 720
      stale-after-days: 14
      store-min-interval-ms: 1500
      call-timeout-ms: 10000
  settings:
    keycloak:
      server-url: ${KEYCLOAK_URL}
      realm: jordylab
      admin-client-id: jordylab-backend
      admin-client-secret: ${KEYCLOAK_BACKEND_SECRET:}
    guest-chat:
      daily-limit: ${JORDYLAB_GUEST_CHAT_DAILY_LIMIT:20}
      zone: Europe/Brussels
    model-catalog:
      cache-ttl-minutes: 60
  mobile:
    release:
      storage-dir: ${MOBILE_RELEASE_STORAGE_DIR:/var/jordylab/mobile-releases}
      # Release certificate SHA-256 as plain hex (prod: backend-config MOBILE_RELEASE_SIGNING_CERT_SHA256).
      signing-cert-sha256: ${MOBILE_RELEASE_SIGNING_CERT_SHA256:}
    download-link:
      secret: ${MOBILE_DOWNLOAD_LINK_SECRET:}
      ttl-minutes: 5
    app:
      # Prod: backend-config (MOBILE_APPLICATION_ID=be.jordylab.app, MOBILE_PRODUCTION_DOMAIN=jordylab.be).
      package-name: ${MOBILE_APPLICATION_ID:}
      production-domain: ${MOBILE_PRODUCTION_DOMAIN:}
    notifications:
      ntfy:
        base-url: ${NTFY_BASE_URL:}
        topic: ${NTFY_TOPIC:}
        token: ${NTFY_TOKEN:}
  cors:
    allowed-origins: ${JORDYLAB_CORS_ALLOWED_ORIGINS}
