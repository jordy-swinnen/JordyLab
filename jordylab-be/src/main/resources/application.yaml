spring:
  application:
    name: jordylab-be
  threads:
    virtual:
      enabled: true
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-4-20250514

jordylab:
  ai:
    health-check-ttl-seconds: 30
    health-check-timeout-seconds: 2
    modules:
      fna:
        provider: anthropic
        model: claude-sonnet-4-20250514
