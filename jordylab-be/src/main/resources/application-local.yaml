# Local development defaults. Only active under the "local" Spring profile — never merged into
# application.yaml, so these values can never leak into prod (FR-002).
#
# Matches podman compose (../compose.yaml): Postgres runs in Podman on localhost.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/jordylab

jordylab:
  # Identity module (spec 019): first-boot admin only while the account table is empty.
  identity:
    bootstrap:
      username: jordy
      password: local-dev-admin-password-not-for-prod
    # JOR-86: the coding agent's test account, re-ensured on every startup. E2E sets both to empty to keep its user
    # list deterministic.
    agent-test:
      username: ${AGENT_TEST_USERNAME:agent}
      password: ${AGENT_TEST_PASSWORD:local-dev-agent-password-not-for-prod}
    webauthn:
      rp-id: localhost
      allowed-origins: http://localhost:4200,http://localhost:4300,http://localhost:4400
  cors:
    # One origin per per-domain dev server (Angular's jordylab/fna/gamecatalog apps on nx serve).
    allowed-origins: http://localhost:4200,http://localhost:4300,http://localhost:4400
