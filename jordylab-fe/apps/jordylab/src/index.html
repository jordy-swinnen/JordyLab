<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JordyLab</title>
    <base href="/" />
    <script src="theme-boot.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="theme-color" content="#131314" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2eee5" media="(prefers-color-scheme: light)" />
    <!-- iOS home-screen support (spec US7, FR-008) — Safari ignores manifest.webmanifest for
         these three concerns and needs its own tags regardless of manifest-spec compliance. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JordyLab" />
    <link rel="preload" href="fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
