<div class="noise-bg min-h-screen">
  <header
    class="sticky top-0 z-50 border-b border-border/60 bg-background/80 backdrop-blur-xl"
  >
    <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-8">
      <div class="flex items-center gap-8">
        <a routerLink="/" class="flex items-baseline gap-1.5">
          <span
            class="font-serif text-2xl italic tracking-tight text-primary"
            style="font-family: 'Instrument Serif', serif"
          >
            JordyLab
          </span>
        </a>
        <nav class="flex gap-0.5">
          <a
            routerLink="/fna"
            routerLinkActive="bg-accent text-foreground"
            hlmBtn
            variant="ghost"
            size="sm"
            class="text-muted-foreground transition-all duration-200"
          >
            FNA
          </a>
          <a
            routerLink="/games"
            routerLinkActive="bg-accent text-foreground"
            hlmBtn
            variant="ghost"
            size="sm"
            class="text-muted-foreground transition-all duration-200"
          >
            Game Catalog
          </a>
        </nav>
      </div>
      <div class="flex items-center gap-3">
        @if (username()) {
          <span class="text-xs text-muted-foreground">{{ username() }}</span>
          <button hlmBtn variant="ghost" size="sm" (click)="onLogout()">Logout</button>
        }
      </div>
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-8 py-10">
    <router-outlet />
  </main>
</div>
