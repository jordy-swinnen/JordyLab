@if (error()) {
  <lib-error-state [message]="error() ?? ''" (retry)="reload()" />
} @else {
  <lib-portfolio-manager-view
    [positions]="positions()"
    [wishlist]="wishlist()"
    [wishlistError]="wishlistError()"
    [totalWorth]="totalWorth()"
    [hasAnyPrices]="hasAnyPrices()"
    (addPosition)="addPosition($event)"
    (deletePosition)="deletePosition($event)"
    (addWishlistItem)="addWishlistItem($event)"
    (deleteWishlistItem)="deleteWishlistItem($event)"
    [openedPositionId]="openedPositionId()"
    [history]="history()"
    [historyLoading]="historyLoading()"
    [historyError]="historyError()"
    [historyPeriod]="historyPeriod()"
    (openHistory)="openHistory($event)"
    (closeHistory)="closeHistory()"
    (historyPeriodSelected)="selectHistoryPeriod($event)"
    (historyRetry)="retryHistory()"
  />
}
