<div class="relative flex flex-wrap items-center gap-3" data-testid="filter-bar">
  <div class="relative min-w-0 flex-1 basis-[280px]">
    <svg
      class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-muted-foreground"
      width="19"
      height="19"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.7"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <circle cx="11" cy="11" r="7" />
      <path d="M20 20l-4-4" />
    </svg>
    <input
      hlmInput
      type="search"
      placeholder="Search by title…"
      aria-label="Search games by title"
      class="h-[50px] w-full rounded-[13px] border-input bg-card pl-12 text-[15px]"
      [value]="searchTerm()"
      (input)="onSearchInput($event)"
    />
  </div>

  <button
    #filtersButton
    type="button"
    class="inline-flex h-[50px] cursor-pointer items-center gap-2.5 rounded-[13px] border border-input bg-card px-4 text-sm font-semibold outline-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary aria-expanded:border-primary"
    aria-haspopup="dialog"
    aria-controls="library-filters-panel"
    data-testid="filters-button"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
      <path d="M4 7h10M18 7h2M4 17h2M10 17h10" />
      <circle cx="16" cy="7" r="2" />
      <circle cx="8" cy="17" r="2" />
    </svg>
    Filters
    @if (activeCount() > 0) {
      <span
        class="inline-grid h-[22px] min-w-[22px] place-items-center rounded-full bg-primary px-1 font-mono text-[11px] font-medium text-primary-foreground"
        [attr.aria-label]="activeCount() + (activeCount() === 1 ? ' filter active' : ' filters active')"
        data-testid="filters-count"
      >
        {{ activeCount() }}
      </span>
    }
  </button>

  <label class="inline-flex h-[50px] items-center gap-2 rounded-[13px] border border-input bg-card pl-4 pr-2 text-sm text-secondary-foreground">
    <span class="font-mono text-[10.5px] font-medium uppercase tracking-[0.12em] text-muted-foreground">Sort</span>
    <select
      class="h-full cursor-pointer bg-transparent pr-2 text-sm font-semibold text-foreground outline-none focus-visible:outline-2 focus-visible:outline-primary"
      data-testid="sort-select"
      [value]="sort()"
      (change)="onSortChange($event)"
    >
      @for (option of sorts; track option.value) {
        <option [value]="option.value" [selected]="option.value === sort()" class="bg-card">{{ option.label }}</option>
      }
    </select>
  </label>

  @if (open()) {
    <button
      type="button"
      class="fixed inset-0 z-20 cursor-default bg-black/55 min-[641px]:bg-transparent"
      aria-label="Close filters"
      tabindex="-1"
      (click)="open.set(false)"
    ></button>
  }
  <div id="library-filters-panel" class="contents">
    <ng-content />
  </div>
</div>
