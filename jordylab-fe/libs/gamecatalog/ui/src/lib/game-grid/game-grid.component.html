  [platforms]="platforms()"
  [hosts]="hosts()"

  [error]="error()"
  [selectedPlatform]="selectedPlatform()"
  [selectedHost]="selectedHost()"
  [selectedInstallStatus]="selectedInstallStatus()"
  [selectedLibrarySource]="selectedLibrarySource()"
  [localMultiplayerOnly]="localMultiplayerOnly()"
  [hostFilterAvailable]="hostFilterAvailable()"
  [page]="page()"

  [totalElements]="totalElements()"
