<lib-source-manager-view
  [sources]="sources()"
  [health]="health()"
  [exclusions]="exclusions()"
  [exclusionsLoading]="exclusionsLoading()"
  [exclusionPending]="exclusionPending()"
  [healthExceptions]="healthExceptions()"
  [loadingExceptions]="loadingExceptions()"
  [loading]="loading()"
  [error]="error()"
  [togglingId]="togglingId()"
  [disableQuote]="disableQuote()"
  [editingSourceId]="editingSourceId()"
  [renamingHostId]="renamingHostId()"
  [hostNameProblem]="hostNameProblem()"
  [libraryStatus]="libraryStatus()"
  [librarySyncing]="librarySyncing()"
  [lastLibraryRun]="lastLibraryRun()"
  (reload)="onReload()"
  (toggleSource)="onToggle($event)"
  (confirmDisable)="onConfirmDisable()"
  (cancelDisable)="onCancelDisable()"
  (editHostName)="onEditHostName($event)"
  (cancelHostName)="onCancelHostName()"
  (renameHost)="onRenameHost($event)"
  (showExceptions)="onShowExceptions($event)"
  (showPlayerCountGames)="onShowPlayerCountGames($event)"
  (includeExcluded)="onIncludeExcluded($event)"
  (hideExceptions)="onHideExceptions()"
  (syncOwnedLibrary)="onSyncOwnedLibrary()"
  (syncFamilyLibrary)="onSyncFamilyLibrary($event)"
>
  <lib-refresh-panel
    [dataRun]="dataRun()"
    [aiRun]="aiRun()"
    [starting]="refreshStarting()"
    [aiCostQuote]="aiCostQuote()"
    [error]="refreshError()"
    (startData)="onStartDataRefresh()"
    (requestAi)="onRequestAiRefresh()"
    (confirmAi)="onConfirmAiRefresh()"
    (cancelAi)="onCancelAiRefresh()"
    (stopRun)="onStopRefresh($event)"
    (dismissError)="onDismissRefreshError()"
  />
  <lib-exclusions-panel
    [exclusions]="exclusions()"
    [loading]="exclusionsLoading()"
    [pending]="exclusionPending()"
    (include)="onIncludeExcluded($event)"
  />
</lib-source-manager-view>
