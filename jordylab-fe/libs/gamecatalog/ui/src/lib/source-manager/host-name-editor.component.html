<form
  class="mt-3 flex flex-col gap-2"
  data-testid="host-name-editor"
  (submit)="$event.preventDefault(); save.emit(nameInput.value)"
  (keydown.escape)="dismiss.emit()"
>
  <label class="mono-label" for="host-name-input">Name for this machine</label>
  <div class="flex flex-wrap items-center gap-2">
    <input
      #nameInput
      id="host-name-input"
      hlmInput
      type="text"
      class="h-10 w-72 max-w-full"
      autocomplete="off"
      [maxLength]="maxLength"
      [value]="displayName() ?? ''"
      [placeholder]="hostname()"
      [attr.aria-invalid]="problem() ? 'true' : null"
      [attr.aria-describedby]="problem() ? 'host-name-problem' : null"
    />
    <button hlmBtn type="submit" size="sm" [disabled]="saving()" data-testid="host-name-save">
      {{ saving() ? 'Saving…' : 'Save' }}
    </button>
    <button hlmBtn type="button" size="sm" variant="ghost" data-testid="host-name-cancel" (click)="dismiss.emit()">
      Cancel
    </button>
    @if (displayName()) {
      <button
        hlmBtn
        type="button"
        size="sm"
        variant="ghost"
        [disabled]="saving()"
        data-testid="host-name-clear"
        (click)="save.emit('')"
      >
        Use hostname
      </button>
    }
  </div>
  @if (problem(); as message) {
    <p id="host-name-problem" role="alert" class="text-sm text-destructive" data-testid="host-name-problem">
      {{ message }}
    </p>
  }
</form>
