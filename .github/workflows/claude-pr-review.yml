name: Claude PR Review

on:
  pull_request:
    types: [opened, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so `git diff origin/<base>...HEAD` works when the PR is too
          # large for `gh pr diff` (GitHub refuses diffs over 300 files).
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against JordyLab's actual conventions,
            not generic advice. Before reviewing any file, read:
            - AGENTS.md (root) — architecture principles, module boundaries
            - jordylab-be/AGENTS.md — Java/Spring Modulith/Flyway conventions
            - jordylab-fe/AGENTS.md — Angular/Nx conventions
            - garmin-sync-service/AGENTS.md — Python conventions
            - coding-master-prompt.md — cross-cutting code style baseline
            - .specify/memory/constitution.md — project-wide coding principles

            ## Spec-driven development (SDD) conformance

            This repo is spec-driven: features are planned under `specs/<NNN-slug>/`
            (spec.md, plan.md, tasks.md, contracts/) before implementation. Before
            reviewing the diff:
            1. Find the active spec directory. Prefer one whose slug matches the PR's
               branch or title; otherwise use the most recently modified `specs/*/`.
               If no `specs/` directory exists at all, skip this section entirely —
               do not block a PR over SDD conformance on a repo with no specs yet.
            2. Read that directory's `spec.md`, `plan.md`, `tasks.md`, and everything
               under `contracts/`.
            3. Cross-check the diff against them and flag, as their own review
               comments (not folded into unrelated line comments):
               - Behavior in the diff that isn't backed by any FR/requirement in
                 spec.md — either the spec is stale or the change is out of scope.
               - FRs that are clearly in this diff's scope but left unimplemented.
               - A `contracts/*.md` file describing behavior the code doesn't
                 actually have (e.g. a documented timeout, return contract, or
                 config key that doesn't match the implementation) — the contract
                 doc is supposed to be truth, not aspiration.
               - `tasks.md` checkboxes marked `[x]` for work that isn't actually
                 present in this diff or the existing code.
            This is a conformance check, not a rubber stamp — if the spec and the
            code already agree, say so briefly rather than inventing findings.

            Apply what those files actually say, including but not limited to:
            - Spring Modulith boundaries: module root package is the public
              API (facade + DTOs); sub-packages are internal; never import
              another module's internals directly
            - Java: never use `var`; Lombok `@Builder` over hand-written
              constructors; `Preconditions.checkArgument` lives only in a
              hand-written `build()`; `record` over `@Data`; entity
              equals/hashCode is inherited from BaseEntity, never
              `@EqualsAndHashCode` or Lombok-generated
            - Testing: never `any()` in Mockito — use explicit values or a
              named, asserted `ArgumentCaptor`; an `ArgumentCaptor` created
              inline and never assigned to a variable is `any()` in
              disguise and is equally forbidden; TestBuilder classes follow
              the canonical `@UtilityClass` + `DEFAULT_*` +
              `aX()`/`aDefaultX()` shape
            - Flyway: every migration starts with `CREATE SCHEMA IF NOT
              EXISTS` and targets the correct schema; never modify an
              applied migration
            - Angular: `inject(Service)` over constructor injection; Angular
              signals for state, never NgRx — API-backed state lives in a
              signal store (see `/angular-signal-store`), not scattered
              across component fields; `bun`/`bunx` only, never npm/npx/yarn;
              Vitest + `@ngneat/spectator/vitest`, never Jest; mock
              dependencies with `useValue` + `vi.fn()`, never a hand-written
              mock class + `useClass`

            Note: the PR branch is already checked out in the current
            working directory.

            ## Getting the diff

            Start with `gh pr diff ${{ github.event.pull_request.number }}`. GitHub
            rejects that call (HTTP 406, "exceeded the maximum number of files")
            once a PR touches more than 300 files. If it fails, do not give up:
            - list the changed files with
              `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files --paginate`
              or `git diff --name-only origin/${{ github.base_ref }}...HEAD`
            - read per-file diffs with
              `git diff origin/${{ github.base_ref }}...HEAD -- <path>`
            - on a very large PR, prioritise: application code and tests first,
              then config/CI, and skip generated files, lockfiles and vendored
              or build output. Say in the summary what you did not cover.

            Use `gh pr comment` for a top-level summary only — one comment,
            not a running log. You MUST post this summary comment on every run,
            even when you found nothing to flag or could not review part of the
            PR (e.g. the diff was unavailable or truncated) — say so plainly in
            the comment. A run that ends without any GitHub comment is a failure.
            Pass the comment body to `gh pr comment` as one plain double-quoted
            string. Do not use command substitution (`$(...)`), heredocs, or
            pipes into commands other than head/tail/wc/cat/grep/ls — those are
            the only shell helpers available and anything else is denied.
            Keep the summary under ~60 lines.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) to flag specific issues at the exact line,
            citing which convention/file is being violated.
            Only post GitHub comments — don't submit review text as plain
            chat messages.

          claude_args: |
            --max-turns 80
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(cat:*),Bash(grep:*),Bash(ls:*)"
