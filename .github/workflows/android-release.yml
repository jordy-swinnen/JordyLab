name: Android Release

# Builds and publishes a signed release APK for the JordyLab mobile app (spec 007, research D7/D8/D13/D14).
#
# STOP-AND-REPORT GATE (research D14): this workflow assumes the release signing keystore already
# exists as the ANDROID_KEYSTORE_BASE64 secret (plus its passwords) and that the realm/service
# account described in research D13 (client `mobile-release-ci`, role `mobile-release-publisher`)
# have been created — see tasks.md T052. Do not tag a release before both are confirmed.

on:
  push:
    tags:
      - 'mobile-v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jordylab-fe
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Extract version from tag
        id: version
        # Tag shape: mobile-v<versionName>-<versionCode>, e.g. mobile-v1.3.0-14 (research D8's
        # MobileRelease.versionCode is the monotonic Android integer; versionName is the display string).
        run: |
          TAG="${GITHUB_REF_NAME#mobile-v}"
          VERSION_NAME="${TAG%-*}"
          VERSION_CODE="${TAG##*-}"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Build the mobile web bundle
        run: bunx nx build jordylab --configuration=mobile

      - name: Sync the native Android project
        working-directory: jordylab-fe/apps/jordylab-mobile
        run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode the release keystore
        working-directory: jordylab-fe/apps/jordylab-mobile/android
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Assemble the signed release APK
        working-directory: jordylab-fe/apps/jordylab-mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Remove the decoded keystore
        if: always()
        working-directory: jordylab-fe/apps/jordylab-mobile/android
        run: rm -f release.keystore

      - name: Get a mobile-release-publisher access token
        id: token
        run: |
          RESPONSE=$(curl -sS -f -X POST \
            "${{ secrets.KEYCLOAK_URL }}/realms/jordylab/protocol/openid-connect/token" \
            -d "grant_type=client_credentials" \
            -d "client_id=mobile-release-ci" \
            -d "client_secret=${{ secrets.MOBILE_RELEASE_CI_CLIENT_SECRET }}")
          echo "access_token=$(echo "$RESPONSE" | jq -r '.access_token')" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        working-directory: jordylab-fe/apps/jordylab-mobile/android
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          curl -sS -f -X POST "${{ secrets.JORDYLAB_API_BASE_URL }}/api/mobile/releases" \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -F "versionName=${{ steps.version.outputs.name }}" \
            -F "versionCode=${{ steps.version.outputs.code }}" \
            -F "releaseNotes=${{ github.event.head_commit.message }}" \
            -F "file=@${APK_PATH};type=application/vnd.android.package-archive"
