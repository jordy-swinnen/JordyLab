name: Deploy to Production

# Deploys one target to production (docs/runbook.md §10, §11). The target is a commit sha or a release tag.
# - Called by build.yml after a green Build on main (automatic: true). Runs only while the repository variable
#   AUTO_DEPLOY is 'true'; a superseded target (older than the live commit) is skipped, not applied.
# - Run by hand (Actions → Deploy to Production → Run workflow): a commit sha or a release tag, for a redeploy or a
#   rollback. Older commits are allowed, so manual runs are never superseded.
# A failed rollout or smoke check rolls back to the previously live commit, with its images and manifests (FR-010).

on:
  workflow_call:
    inputs:
      target:
        description: "Commit sha to deploy (build.yml passes github.sha)"
        required: true
        type: string
      automatic:
        description: "true when called from build.yml; enables the superseded check"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      target:
        description: "A full commit sha, or a release tag vX.Y.Z or vX.Y.Z-rcN (older commits are allowed, for rollback)"
        required: true
        type: string
      dry_run:
        description: "Check the target without changing the cluster: validation, live state, a server-side apply dry run and the smoke checks"
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      TARGET: ${{ inputs.target }}
      AUTOMATIC: ${{ inputs.automatic || false }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - name: Check out the target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
          fetch-depth: 0

      - name: Validate and resolve the target
        id: resolve_target
        run: |
          resolution="$(deploy/scripts/deploy-decision.sh --target "$TARGET" --live-tag "" --automatic "$AUTOMATIC")"
          printf '%s\n' "$resolution" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$resolution"
          if printf '%s\n' "$resolution" | grep -qx 'decision=refused'; then
            echo "::error::the target is refused: $(printf '%s\n' "$resolution" | grep '^reason=' | cut -d= -f2-)"
            exit 1
          fi

      - name: Set up buildx and log in to the registry
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check that the target's images exist
        env:
          IMAGE_TAG: ${{ steps.resolve_target.outputs.image_tag }}
        run: |
          for component in backend frontend keycloak; do
            image="ghcr.io/jordy-swinnen/jordylab-${component}:${IMAGE_TAG}"
            if ! docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "::error::the image $image does not exist: the target is refused (FR-014)"
              exit 1
            fi
          done

      - name: Join Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Install sops, age, kustomize, kubectl
        # Pinned versions. kubectl matches the cluster's minor (k3s v1.36.4) to stay inside the
        # supported ±1 skew; bump it together with k3s.
        run: |
          sudo curl -sSLo /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          sudo chmod +x /usr/local/bin/sops
          curl -sSL https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/age/age /tmp/age/age-keygen /usr/local/bin/
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/
          curl -sSLO "https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          sops --version && age --version && kustomize version && kubectl version --client

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CA_CERT }}" | base64 -d > /tmp/ca.crt
          kubectl config set-cluster jordylab --server="${{ secrets.KUBE_SERVER }}" --certificate-authority=/tmp/ca.crt
          kubectl config set-credentials ci-deploy --token="${{ secrets.KUBE_TOKEN }}"
          kubectl config set-context jordylab --cluster=jordylab --user=ci-deploy --namespace=jordylab
          kubectl config use-context jordylab

      - name: Read the live images
        id: read_live_state
        run: |
          backend_image="$(kubectl -n jordylab get deploy backend -o jsonpath='{.spec.template.spec.containers[0].image}')"
          frontend_image="$(kubectl -n jordylab get deploy frontend -o jsonpath='{.spec.template.spec.containers[0].image}')"
          keycloak_image="$(kubectl -n jordylab get deploy keycloak -o jsonpath='{.spec.template.spec.containers[0].image}')"
          {
            echo "live_backend_image=$backend_image"
            echo "live_frontend_image=$frontend_image"
            echo "live_keycloak_image=$keycloak_image"
            echo "live_tag=${backend_image##*:}"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether to apply
        id: decide
        env:
          LIVE_TAG: ${{ steps.read_live_state.outputs.live_tag }}
        run: |
          decision_output="$(deploy/scripts/deploy-decision.sh --target "$TARGET" --live-tag "$LIVE_TAG" --automatic "$AUTOMATIC")"
          printf '%s\n' "$decision_output" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$decision_output"

      - name: Check the newest backup
        id: backup
        continue-on-error: true
        run: |
          kubectl -n jordylab get backups.postgresql.cnpg.io -o json 2>/dev/null | deploy/scripts/backup-freshness.sh >> "$GITHUB_OUTPUT"

      - name: Apply the target
        id: apply
        if: steps.decide.outputs.decision == 'proceed'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          IMAGE_TAG: ${{ steps.resolve_target.outputs.image_tag }}
        run: |
          cd deploy/k8s/overlays/prod
          # Decrypts in place, in this ephemeral, never-committed checkout only: the ciphertext in git is untouched.
          sops --output secrets.sops.yaml -d secrets.sops.yaml
          kustomize edit set image \
            ghcr.io/jordy-swinnen/jordylab-backend="ghcr.io/jordy-swinnen/jordylab-backend:${IMAGE_TAG}" \
            ghcr.io/jordy-swinnen/jordylab-frontend="ghcr.io/jordy-swinnen/jordylab-frontend:${IMAGE_TAG}" \
            ghcr.io/jordy-swinnen/jordylab-keycloak="ghcr.io/jordy-swinnen/jordylab-keycloak:${IMAGE_TAG}"
          # Recorded just before the real apply: from here on a failure may roll back (see the rollback step).
          if [ "$DRY_RUN" = "true" ]; then
            kustomize build . | kubectl apply --dry-run=server -f -
          else
            echo "started=true" >> "$GITHUB_OUTPUT"
            kustomize build . | kubectl apply -f -
          fi

      - name: Wait for a healthy rollout
        id: rollout
        if: steps.decide.outputs.decision == 'proceed' && inputs.dry_run != true
        run: |
          kubectl -n jordylab rollout status deploy/backend --timeout=8m
          kubectl -n jordylab rollout status deploy/frontend --timeout=5m
          kubectl -n jordylab rollout status deploy/keycloak --timeout=8m

      - name: Smoke-check the public site
        id: smoke
        if: steps.decide.outputs.decision == 'proceed'
        run: deploy/scripts/smoke-check.sh --base-url https://jordylab.be

      - name: Roll back to the previously live commit
        id: rollback
        # Only after the cluster was changed, with a known previous commit (FR-010, FR-012); never for a refused or superseded target.
        if: failure() && steps.apply.outputs.started == 'true' && steps.decide.outputs.live_commit != 'unknown' && inputs.dry_run != true
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          PREVIOUS_COMMIT: ${{ steps.decide.outputs.live_commit }}
          TARGET_COMMIT: ${{ steps.resolve_target.outputs.target_commit }}
          PREVIOUS_BACKEND_IMAGE: ${{ steps.read_live_state.outputs.live_backend_image }}
          PREVIOUS_FRONTEND_IMAGE: ${{ steps.read_live_state.outputs.live_frontend_image }}
          PREVIOUS_KEYCLOAK_IMAGE: ${{ steps.read_live_state.outputs.live_keycloak_image }}
        run: |
          set -o pipefail
          if ! git diff --quiet "$PREVIOUS_COMMIT" "$TARGET_COMMIT" -- deploy/k8s/overlays/prod/secrets.sops.yaml; then
            echo "secrets_changed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::the secrets file differs between $PREVIOUS_COMMIT and $TARGET_COMMIT: the rollback re-applies the previous values (runbook §11: roll forward for secret rotations)"
          fi
          git worktree add --detach "$RUNNER_TEMP/previous" "$PREVIOUS_COMMIT"
          cd "$RUNNER_TEMP/previous/deploy/k8s/overlays/prod"
          sops --output secrets.sops.yaml -d secrets.sops.yaml
          kustomize edit set image \
            ghcr.io/jordy-swinnen/jordylab-backend="ghcr.io/jordy-swinnen/jordylab-backend:${PREVIOUS_BACKEND_IMAGE##*:}" \
            ghcr.io/jordy-swinnen/jordylab-frontend="ghcr.io/jordy-swinnen/jordylab-frontend:${PREVIOUS_FRONTEND_IMAGE##*:}" \
            ghcr.io/jordy-swinnen/jordylab-keycloak="ghcr.io/jordy-swinnen/jordylab-keycloak:${PREVIOUS_KEYCLOAK_IMAGE##*:}"
          kustomize build . | kubectl apply -f -
          kubectl -n jordylab rollout status deploy/backend --timeout=8m
          kubectl -n jordylab rollout status deploy/frontend --timeout=5m
          kubectl -n jordylab rollout status deploy/keycloak --timeout=8m

      - name: Smoke-check after the rollback
        id: rollback_smoke
        if: always() && steps.rollback.outcome == 'success'
        run: deploy/scripts/smoke-check.sh --base-url https://jordylab.be

      - name: Remove the rollback worktree
        if: always() && steps.rollback.outcome != 'skipped'
        run: git worktree remove --force "$RUNNER_TEMP/previous" || true

      - name: Summarise the run
        if: always()
        env:
          RESOLVE_DECISION: ${{ steps.resolve_target.outputs.decision }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          TARGET_COMMIT: ${{ steps.resolve_target.outputs.target_commit }}
          DECISION: ${{ steps.decide.outputs.decision }}
          PREVIOUS_LIVE_COMMIT: ${{ steps.decide.outputs.live_commit }}
          APPLY_STARTED: ${{ steps.apply.outputs.started }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          ROLLOUT_OUTCOME: ${{ steps.rollout.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
          ROLLBACK_SMOKE_OUTCOME: ${{ steps.rollback_smoke.outcome }}
          SECRETS_CHANGED: ${{ steps.rollback.outputs.secrets_changed }}
          BACKUP_NEWEST: ${{ steps.backup.outputs.newest_completed_at }}
          BACKUP_AGE_HOURS: ${{ steps.backup.outputs.age_hours }}
          BACKUP_REASON: ${{ steps.backup.outputs.reason }}
        run: |
          if [ "$RESOLVE_DECISION" = "refused" ]; then
            outcome="refused"
            live_after="unchanged"
          elif [ "$DRY_RUN" = "true" ] && [ "$DECISION" = "proceed" ] && [ "$SMOKE_OUTCOME" = "success" ] && [ "$APPLY_OUTCOME" = "success" ]; then
            outcome="dry-run-ok"
            live_after="unchanged (dry run)"
          elif [ "$DRY_RUN" = "true" ]; then
            outcome="dry-run-failed"
            live_after="unchanged (dry run)"
          elif [ "$DECISION" = "superseded" ]; then
            outcome="superseded"
            live_after="unchanged"
          elif [ "$ROLLOUT_OUTCOME" = "success" ] && [ "$SMOKE_OUTCOME" = "success" ]; then
            outcome="live"
            live_after="$TARGET_COMMIT"
          elif [ "$ROLLBACK_OUTCOME" = "success" ] && [ "$ROLLBACK_SMOKE_OUTCOME" = "success" ]; then
            outcome="rolled-back"
            live_after="$PREVIOUS_LIVE_COMMIT"
          elif [ "$ROLLBACK_OUTCOME" = "failure" ] || [ "$ROLLBACK_SMOKE_OUTCOME" = "failure" ]; then
            outcome="rollback-failed"
            live_after="unknown: the cluster state is not confirmed"
          elif [ "$APPLY_STARTED" != "true" ]; then
            outcome="failed before the cluster was changed"
            live_after="$PREVIOUS_LIVE_COMMIT"
          elif [ "$PREVIOUS_LIVE_COMMIT" = "unknown" ]; then
            outcome="no-previous"
            live_after="$TARGET_COMMIT, not confirmed healthy"
          else
            outcome="failed"
            live_after="unknown"
          fi

          if [ "$outcome" = "rolled-back" ]; then
            echo "::error::the release failed and production was rolled back to $PREVIOUS_LIVE_COMMIT"
          elif [ "$outcome" = "rollback-failed" ]; then
            echo "::error::the rollback failed: follow docs/runbook.md §11 (emergency path)"
          elif [ "$outcome" = "no-previous" ]; then
            echo "::error::no previously live commit is known, so nothing was rolled back (FR-012)"
          elif [ "$outcome" = "superseded" ]; then
            echo "::notice::$TARGET_COMMIT is older than the live commit; it was not applied"
          fi

          {
            echo "## Deploy to Production"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Outcome | $outcome |"
            echo "| Target commit | $TARGET_COMMIT |"
            echo "| Previously live commit | $PREVIOUS_LIVE_COMMIT |"
            echo "| Live after the run | $live_after |"
            if [ "$SECRETS_CHANGED" = "true" ]; then
              echo "| Warning | the secrets file differs from the previous commit; a rollback re-applies the old values |"
            fi
            if [ -n "$BACKUP_NEWEST" ]; then
              echo "| Newest completed backup | $BACKUP_NEWEST (${BACKUP_AGE_HOURS} h old) |"
            else
              echo "| Newest completed backup | none found (${BACKUP_REASON:-unreadable}) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
