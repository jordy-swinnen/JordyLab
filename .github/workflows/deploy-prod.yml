name: Deploy to Production

# Deploys one released version (a `v*` tag) to production — docs/runbook.md §20.
# - Called by release.yml after a tag is verified and its images are retagged.
# - Run by hand (Actions → Deploy to Production → Run workflow) to redeploy or roll back to any
#   earlier release: enter its tag, e.g. v0.1.0.
# A push to main no longer deploys by itself (spec 011 BUG-008); an empty input can no longer
# deploy an image tagged `sha-` (BUG-005).

on:
  workflow_call:
    inputs:
      version:
        description: "Release tag to deploy, e.g. v0.1.0"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to deploy or roll back to, e.g. v0.1.0"
        required: true
        type: string

jobs:
  deploy:
    # One production deploy at a time, whether called by release.yml or run by hand.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production # required reviewer = Jordy (docs/runbook.md §9) — this is the manual approval gate (FR-006)
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Reject anything that isn't a release tag
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]] || { echo "::error::'$VERSION' is not a release tag (vX.Y.Z or vX.Y.Z-rcN)"; exit 1; }

      # Check out the released commit, so the manifests match the images.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}

      - name: Join Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Install sops, age, kustomize, kubectl
        # Pinned versions. kubectl matches the cluster's minor (k3s v1.36.4) to stay inside the
        # supported ±1 skew; bump it together with k3s.
        run: |
          sudo curl -sSLo /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          sudo chmod +x /usr/local/bin/sops
          curl -sSL https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/age/age /tmp/age/age-keygen /usr/local/bin/
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/
          curl -sSLO "https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          sops --version && age --version && kustomize version && kubectl version --client

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CA_CERT }}" | base64 -d > /tmp/ca.crt
          kubectl config set-cluster jordylab --server="${{ secrets.KUBE_SERVER }}" --certificate-authority=/tmp/ca.crt
          kubectl config set-credentials ci-deploy --token="${{ secrets.KUBE_TOKEN }}"
          kubectl config set-context jordylab --cluster=jordylab --user=ci-deploy --namespace=jordylab
          kubectl config use-context jordylab

      - name: Decrypt secrets and apply
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          cd deploy/k8s/overlays/prod
          # Decrypts in place, in this ephemeral, never-committed checkout only — the ciphertext
          # in git is untouched. kustomization.yaml's `resources:` already points at this
          # filename, so `kustomize build` below picks up the now-plaintext Secret.
          sops --output secrets.sops.yaml -d secrets.sops.yaml
          kustomize edit set image \
            ghcr.io/jordy-swinnen/jordylab-backend="ghcr.io/jordy-swinnen/jordylab-backend:${VERSION}" \
            ghcr.io/jordy-swinnen/jordylab-frontend="ghcr.io/jordy-swinnen/jordylab-frontend:${VERSION}" \
            ghcr.io/jordy-swinnen/jordylab-keycloak="ghcr.io/jordy-swinnen/jordylab-keycloak:${VERSION}"
          kustomize build . | kubectl apply -f -

      - name: Wait for a healthy rollout
        run: |
          kubectl -n jordylab rollout status deploy/backend --timeout=8m
          kubectl -n jordylab rollout status deploy/frontend --timeout=5m
          kubectl -n jordylab rollout status deploy/keycloak --timeout=8m
