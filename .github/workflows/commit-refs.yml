name: Commit References

# Every commit in a pull request must start with its Kaneo ticket (`JOR-55: adding a button`, commits made after
# 2026-11-02T00:30Z) and name what it serves (`Refs: JOR-55`, `Refs: JOR-78/D3`, `Refs: JOR-122/FR-004`) or say it
# has no ticket (`Refs: NO-CODE`) — AGENTS.md → "Commits". A `chore:` subject is exempt from
# both rules (owner decision, used by the weekly Skills Sync bot). Runs the same .githooks/commit-msg script as the
# local hook, so clones without the hook installed are caught too.

on:
  pull_request:

permissions:
  contents: read

jobs:
  refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check every non-merge commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for commit in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$commit" > /tmp/commit-message
            if ! sh .githooks/commit-msg /tmp/commit-message "$(git log -1 --format=%ct "$commit")"; then
              echo "::error::$(git log -1 --format='%h %s' "$commit") — subject must start with JOR-<n> (or chore:), and a valid Refs: trailer is required"
              failed=1
            fi
          done
          exit "$failed"
