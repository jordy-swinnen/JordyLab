name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/jordy-swinnen/jordylab

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  licence-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails if any MIT licence file or declaration has crept back in (SC-007, US7).
      # Excludes this workflow file and specs/ (feature docs that discuss the check itself, or
      # quote past decisions, are not licence declarations).
      - name: No MIT licence anywhere in the repo
        run: |
          if grep -ril "mit license" . \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude-dir=build \
              --exclude-dir=specs --exclude=build.yml; then
            echo "::error::MIT licence text found — this repo is all-rights-reserved (see LICENSE)."
            exit 1
          fi
          if grep -rl "SPDX-License-Identifier: MIT" . \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude-dir=build \
              --exclude-dir=specs --exclude=build.yml; then
            echo "::error::MIT licence text found — this repo is all-rights-reserved (see LICENSE)."
            exit 1
          fi

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      # `check` = tests + ModularityTests + the JaCoCo ≥ 80 % per-package gate (001 FR-016b; spec 011 BUG-004).
      - name: Run backend tests and coverage gate
        working-directory: jordylab-be
        run: ./gradlew check --no-daemon

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Nx 23 needs Node 22+ (Angular 22 later needs 22.22.3+). Floating 22 resolves to the newest 22.x, which satisfies both;
      # pinned here instead of relying on the runner image's default (spec 012 T008).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: jordylab-fe
        run: bun install --frozen-lockfile
      # Fast first pass (spec 012 FR-021): Oxlint owns only the oxc and unicorn rules ESLint does not have, so a plain error fails
      # here in seconds. ESLint below still gates everything Oxlint cannot see (templates, Angular, module boundaries).
      - name: Oxlint
        working-directory: jordylab-fe
        run: bunx nx run-many --target=oxlint --all

      # No rule may be enabled in both linters (FR-012): fails with the list of rules that overlap.
      - name: Lint rule ownership
        working-directory: jordylab-fe
        run: tools/check-lint-ownership.sh

      # Module boundaries and template accessibility are lint rules (001 FR-011–FR-013; spec 011 BUG-003).
      - name: Lint
        working-directory: jordylab-fe
        run: bunx nx run-many --target=lint --all

      # --coverage activates each project's `thresholds: { lines: 80 }` (001 FR-016a/c; spec 011 BUG-004).
      - name: Run frontend tests with coverage gate
        working-directory: jordylab-fe
        run: bunx nx run-many --target=test --all --coverage

  # Boots the *built* app in headless Chrome and requires the login page to render: the only check on the real start-up
  # path (main.ts -> pre-bootstrap auth -> bootstrapApplication). Unit tests could not see the rc12 blank page (NG0201,
  # spec 011 BUG-056). Chrome is preinstalled on ubuntu-latest; the script has no dependencies.
  app-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: jordylab-fe
        run: bun install --frozen-lockfile
      - name: Build the production bundle
        working-directory: jordylab-fe
        run: bunx nx build jordylab
      - name: Boot the built app in headless Chrome
        working-directory: jordylab-fe
        run: bun tools/app-boot-check.mjs

  # End-to-end journeys against a freshly built app, on this run's own throwaway Postgres + backend (spec 019).
  # Gates merges: make this check required in branch protection. The cleanup steps always run, so nothing outlives the job.
  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Install dependencies
        working-directory: jordylab-fe
        run: bun install --frozen-lockfile
      - name: Install the Playwright browser
        working-directory: jordylab-fe
        run: bunx playwright install --with-deps chromium
      - name: Run the web journeys
        working-directory: jordylab-fe
        env:
          E2E_ARTIFACT_DIRECTORY: ${{ runner.temp }}/e2e-logs
        run: e2e/run.sh web
      - name: Upload the report and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-web-report
          path: |
            jordylab-fe/apps/jordylab-e2e/playwright-report
            jordylab-fe/apps/jordylab-e2e/test-results
            ${{ runner.temp }}/e2e-logs
          if-no-files-found: ignore
      # Even when a step above failed or the job was cancelled: remove what a killed runner left behind, then fail on any leftover.
      - name: Remove leftovers
        if: always()
        working-directory: jordylab-fe
        run: bash e2e/lib/cleanup.sh sweep
      - name: Verify nothing is left
        if: always()
        working-directory: jordylab-fe
        run: bash e2e/lib/cleanup.sh verify-all

  # Fixtures for the deploy decision and backup scripts (spec 019, research D15), and actionlint over the workflows.
  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the deploy decision fixtures
        run: bash deploy/scripts/tests/deploy-decision-cases.sh
      - name: Run the backup freshness fixtures
        run: bash deploy/scripts/tests/backup-freshness-cases.sh
      # actionlint 1.7.12 does not know concurrency.queue (GitHub supports it; deploy-prod-compose.yml needs queue: max).
      - name: Lint the workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -ignore 'unexpected key "queue" for "concurrency" section'

  build-and-push:
    needs: [secret-scan, licence-check, test-backend, test-frontend, app-boot, e2e-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One image failing shouldn't cancel the others.
      fail-fast: false
      matrix:
        # The backend reports the commit it was built from on /actuator/info (spec 019, FR-017).
        include:
          - image: backend
            build-args: JORDYLAB_GIT_COMMIT=${{ github.sha }}
          - image: frontend
            build-args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: type=sha,format=long

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/containers/${{ matrix.image }}/Containerfile
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Deploys the images this run just published (spec 019 research D1, spec 020 T062). Runs only while the repository
  # variable AUTO_DEPLOY is 'true'; the Compose workflow itself skips a target older than the live release.
  deploy:
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AUTO_DEPLOY == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-prod-compose.yml
    with:
      target: ${{ github.sha }}
      automatic: true
    secrets: inherit
