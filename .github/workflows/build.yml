name: Build

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/jordy-swinnen/jordylab

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  licence-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails if any MIT licence file or declaration has crept back in (SC-007, US7).
      # Excludes this workflow file and specs/ (feature docs that discuss the check itself, or
      # quote past decisions, are not licence declarations).
      - name: No MIT licence anywhere in the repo
        run: |
          if grep -ril "mit license" . \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude-dir=build \
              --exclude-dir=specs --exclude=build.yml; then
            echo "::error::MIT licence text found — this repo is all-rights-reserved (see LICENSE)."
            exit 1
          fi
          if grep -rl "SPDX-License-Identifier: MIT" . \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude-dir=build \
              --exclude-dir=specs --exclude=build.yml; then
            echo "::error::MIT licence text found — this repo is all-rights-reserved (see LICENSE)."
            exit 1
          fi

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Run backend tests
        working-directory: jordylab-be
        run: ./gradlew test --no-daemon

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: jordylab-fe
        run: bun install --frozen-lockfile
      - name: Run frontend tests
        working-directory: jordylab-fe
        run: bunx nx run-many --target=test --all

  build-and-push:
    needs: [secret-scan, licence-check, test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One image failing shouldn't cancel the others (Build #14 lost backend/keycloak this way).
      fail-fast: false
      matrix:
        image: [backend, frontend, keycloak]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: type=sha,format=long

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/containers/${{ matrix.image }}/Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
