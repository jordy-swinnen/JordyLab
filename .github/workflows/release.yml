name: Release

# One action releases everything (docs/runbook.md §20): push a semver tag on a commit that is on
# main and has a green Build.
#   git tag v0.1.0 && git push origin v0.1.0        (or GitHub → Releases → Draft a new release)
# 1. verify  — the tag's commit is on main and its Build (push to main) succeeded
# 2. retag   — the tested images sha-<sha> get the release tag; nothing is rebuilt
# 3. release — *draft* GitHub Release with generated notes (vX.Y.Z-rcN → prerelease)
# 4. deploy  — deploy-prod.yml with the release tag, behind the `production` approval
# 5. publish — the draft becomes public only after the deploy succeeded
# (The Android APK job was removed with the native app, spec 018 US4.)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/jordy-swinnen/jordylab

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      version_name: ${{ steps.check.outputs.version_name }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-rc([0-9]+))?$ ]]; then
            echo "::error::'$TAG' is not vX.Y.Z or vX.Y.Z-rcN"; exit 1
          fi
          rc="${BASH_REMATCH[5]}"

          sha="$(git rev-list -n 1 "$TAG")"
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$TAG ($sha) is not on main"; exit 1; }

          builds="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$sha&event=push&status=success" --jq '.total_count')"
          [ "$builds" -gt 0 ] || { echo "::error::no successful Build (push to main) for $sha — its images don't exist"; exit 1; }

          {
            echo "sha=$sha"
            echo "version_name=${TAG#v}"
            echo "prerelease=$([ -n "$rc" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "Release $TAG → commit $sha"

  retag:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [backend, frontend]
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Tag the tested image with the release version (no rebuild)
        env:
          SOURCE: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:sha-${{ needs.verify.outputs.sha }}
          TARGET: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.ref_name }}
        run: |
          docker buildx imagetools create --tag "$TARGET" "$SOURCE"
          docker buildx imagetools inspect "$TARGET" --format '{{json .Manifest.Digest}}'

  release:
    needs: [verify, retag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A draft until deploy succeeds, so a rejected or failed deploy never leaves a public Release.
      - name: Create the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG" --draft)
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" "${flags[@]}"

  deploy:
    needs: [verify, release]
    uses: ./.github/workflows/deploy-prod.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  publish:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the Release now that production runs it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

