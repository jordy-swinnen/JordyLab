name: Hook Tests

on:
  pull_request:
    paths:
      - '.claude/hooks/**'
      - '.githooks/**'
      - 'scripts/mcp/**'
      - '.claude/skills/linear-sync-drafts/**'

jobs:
  guard-cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run pre-bash-guard.sh fixtures
        run: bash .claude/hooks/tests/guard-cases.sh

      - name: Run lint hook fixtures
        run: bash .claude/hooks/tests/lint-cases.sh

      - name: Run advisory hook fixtures
        run: bash .claude/hooks/tests/advisory-cases.sh

      - name: Run commit-msg fixtures
        run: bash .githooks/tests/commit-msg-cases.sh

      - name: Run GitHub MCP launcher fixtures
        run: bash scripts/mcp/tests/github-mcp-cases.sh

      - name: Run Linear sync inventory fixtures
        run: bash .claude/skills/linear-sync-drafts/scripts/tests/inventory-cases.sh

      - name: Run Linear sync open-bugs fixtures
        run: bash .claude/skills/linear-sync-drafts/scripts/tests/open-bugs-cases.sh
