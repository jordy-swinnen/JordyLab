name: Hook Tests

on:
  pull_request:
    paths:
      - '.claude/hooks/**'
      - 'opencode.json'

jobs:
  guard-cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run pre-bash-guard.sh fixtures
        run: bash .claude/hooks/tests/guard-cases.sh

      - name: Run opencode.json permission resolution fixtures
        run: python3 .claude/hooks/tests/opencode_permission_cases.py
