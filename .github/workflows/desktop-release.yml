name: Desktop release

# Tag-triggered (spec 024, ticket D8): builds the sync app on macOS and Linux,
# publishes installers plus update-manifest.json to a GitHub Release. The
# desktop app never touches the production VPS.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            platform: macos-aarch64
            artifact: jordylab-desktop-macos-aarch64
          - os: ubuntu-24.04
            platform: linux-x86_64
            artifact: jordylab-desktop-linux-x86_64
          - os: windows-latest
            platform: windows-x64
            artifact: jordylab-desktop-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: jordylab-desktop
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xkb1 libxcb-cursor0 libxcb-xinerama0
      - name: Parity gate
        working-directory: jordylab-desktop
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/parity -q
      - name: Build
        working-directory: jordylab-desktop
        run: pyinstaller --clean --noconfirm packaging/jordylab-desktop.spec
      - name: Bundle licence texts
        working-directory: jordylab-desktop
        run: |
          mkdir -p dist/jordylab-desktop/licenses
          curl -fsSL https://raw.githubusercontent.com/spdx/license-list-data/main/text/LGPL-3.0-only.txt -o dist/jordylab-desktop/licenses/LGPL-3.0.txt
          curl -fsSL https://raw.githubusercontent.com/python/cpython/v3.12.0/LICENSE -o dist/jordylab-desktop/licenses/PSF-LICENSE.txt
          curl -fsSL https://raw.githubusercontent.com/pyinstaller/pyinstaller/develop/COPYING.txt -o dist/jordylab-desktop/licenses/PyInstaller-COPYING.txt
      - name: Rename artifact
        working-directory: jordylab-desktop
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent dist/jordylab-desktop out/${{ matrix.artifact }}.zip
          elif [ "${{ runner.os }}" = "Windows" ]; then
            powershell Compress-Archive -Path dist/jordylab-desktop -DestinationPath out/${{ matrix.artifact }}.zip
          else
            tar -czf out/${{ matrix.artifact }}.tar.gz -C dist jordylab-desktop
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: jordylab-desktop/out/*

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Build update manifest
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib

          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          platforms = {}
          names = {
              "jordylab-desktop-macos-aarch64.zip": "macos-aarch64",
              "jordylab-desktop-linux-x86_64.tar.gz": "linux-x86_64",
              "jordylab-desktop-windows-x64.zip": "windows-x64",
          }
          for path in pathlib.Path("artifacts").iterdir():
              key = names.get(path.name)
              if key is None:
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              platforms[key] = {
                  "url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['GITHUB_REF_NAME']}/{path.name}",
                  "sha256": digest,
                  "signature": "",
              }
          manifest = {"version": version, "platforms": platforms}
          pathlib.Path("artifacts/update-manifest.json").write_text(json.dumps(manifest, indent=2))
          PY
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
