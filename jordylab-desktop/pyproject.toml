[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jordylab-desktop"
version = "0.1.0"
description = "JordyLab desktop sync app"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.7",
  "tufup>=0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-qt>=4",
  "ruff>=0.5",
]

[project.scripts]
jordylab-desktop = "jordylab_desktop.app:main"

[tool.setuptools.packages.find]
where = ["src", "core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "core"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == \"__main__\":"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["packaging/build", "packaging/dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
