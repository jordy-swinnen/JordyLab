# pgBackRest for the production database (spec 020, research R3). Keys come from the environment
# (PGBACKREST_REPO1_S3_KEY and PGBACKREST_REPO1_S3_KEY_SECRET), never from this file.
[global]
repo1-type=s3
repo1-s3-endpoint=s3.gra.io.cloud.ovh.net
repo1-s3-region=gra
repo1-s3-bucket=jordylab-cnpg-backups
repo1-s3-uri-style=path
repo1-path=/pgbackrest
repo1-retention-full-type=time
repo1-retention-full=30
compress-type=zst
start-fast=y

[jordylab]
pg1-path=/var/lib/postgresql/data
