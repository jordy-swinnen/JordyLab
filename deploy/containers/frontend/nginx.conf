server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No nginx version in the Server header or error pages.
    server_tokens off;

    # Hashed JS/CSS dominate the payload; the stock image has no brotli module.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json text/plain;

    # SPA fallback: Angular's router owns every path that isn't a real file. index.html must always be
    # revalidated, or browsers keep an old shell pointing at chunks a new deploy no longer serves.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Exact match beats the regex locations below: the SPA fallback redirects here internally too.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Content-hashed build output (main-ABCD1234.js, chunk-…, styles-…, media/…): cache for a year.
    location ~* "-[A-Z0-9]{8}\.(?:js|css|woff2?|ttf|svg|png|jpe?g|gif|webp)$" {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Unhashed static files (favicon, icons, silent-check-sso.html): short cache so changes reach users.
    location ~* \.(?:ico|svg|png|jpe?g|gif|webp|html)$ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # PWA manifest with its registered media type (the default mime.types has no webmanifest entry).
    location ~* \.webmanifest$ {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }
}
