# Included in every location of nginx.conf: nginx drops server-level add_header directives in any
# location that sets its own add_header (spec 011 BUG-021), so the headers live here, once.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# Content-Security-Policy, Report-Only first (spec 011 BUG-021 follow-up, MRB-11): the browser logs what it would block and blocks nothing.
# Enforce by renaming the header to Content-Security-Policy once a full signed-in session shows no violation. Every host here is one the
# app really uses: fonts (Google), IGDB cover candidates in "Switch games", our own API and Keycloak (same origin: jordylab.be/auth).
# The sha256 is Angular's one inline script in the production index.html (it swaps the critical-CSS stylesheet to media=all);
# tools/app-boot-check.mjs enforces this exact policy against the built bundle, so CI fails if the hash drifts after an Angular upgrade.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-LMY6wYoFV9I4wWzxaq1N/dTpl4iurQktw706UCHK3vM='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.igdb.com; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
