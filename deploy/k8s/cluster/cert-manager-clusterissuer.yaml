# cert-manager v1.21.2 (research.md §3), installed cluster-wide (not namespaced) with
# `--set config.enableGatewayAPI=true` so it can solve HTTP-01 challenges via a Gateway/HTTPRoute
# instead of a legacy Ingress.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: jordy@jordylab.dev
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: jordylab-gateway
                namespace: jordylab
                sectionName: http
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jordylab-tls
  namespace: jordylab
spec:
  secretName: jordylab-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - placeholder.jordylab.invalid # replaced with the real domain by the prod overlay (T021)
