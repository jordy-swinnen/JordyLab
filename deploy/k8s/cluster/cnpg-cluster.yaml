# CloudNativePG v1.30.1 (research.md §6): a single-instance PostgreSQL 16 Cluster on the k3s
# `local-path` StorageClass. Backs up to OVH Object Storage via the Barman Cloud Plugin
# (ovh-object-storage.yaml) — never the deprecated in-tree `spec.backup.barmanObjectStore`.
#
# Image: the CNPG "standard" flavour, which already ships pgvector (plus pgaudit and failover slots).
# The earlier plan used CNPG's ImageVolume `extensions` stanza for pgvector, but that needs
# PostgreSQL 18+ (extension_control_path), so it cannot work on PostgreSQL 16. The "system" flavour
# is deprecated (it only adds the in-tree Barman binaries we don't use).
#
# Credentials (from secrets.sops.yaml): jordylab-db-app (kubernetes.io/basic-auth) is the owner of the
# `jordylab` database and is used by the backend.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-cluster
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.15-standard-trixie

  storage:
    storageClass: local-path
    size: 10Gi

  bootstrap:
    initdb:
      database: jordylab
      owner: jordylab
      secret:
        name: jordylab-db-app

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1024Mi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: ovh-object-storage
