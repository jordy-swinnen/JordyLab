# CloudNativePG v1.30.1 (research.md §6): a single-instance PostgreSQL 16 Cluster on the k3s
# `local-path` StorageClass, with pgvector added via the official ImageVolume extension (not a
# custom-built image). Backs up to OVH Object Storage via the Barman Cloud Plugin
# (ovh-object-storage.yaml) — never the deprecated in-tree `spec.backup.barmanObjectStore`.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-cluster
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.10-system-trixie

  extensions:
    - name: vector
      image:
        reference: ghcr.io/cloudnative-pg/pgvector-extension:16 # verify exact tag at implementation time

  storage:
    storageClass: local-path
    size: 10Gi

  bootstrap:
    initdb:
      database: jordylab
      owner: jordylab
      postInitSQL:
        - CREATE SCHEMA IF NOT EXISTS keycloak;

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1024Mi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: ovh-object-storage
