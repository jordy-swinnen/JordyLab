# Namespace-scoped deploy credential for CI (FR-007). The token minted from this ServiceAccount
# can only touch resources in the `jordylab` namespace — never the k3s admin kubeconfig.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deploy
  namespace: jordylab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deploy
  namespace: jordylab
rules:
  - apiGroups: ["", "apps", "gateway.networking.k8s.io", "cert-manager.io", "postgresql.cnpg.io", "batch"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deploy
  namespace: jordylab
subjects:
  - kind: ServiceAccount
    name: ci-deploy
    namespace: jordylab
roleRef:
  kind: Role
  name: ci-deploy
  apiGroup: rbac.authorization.k8s.io
