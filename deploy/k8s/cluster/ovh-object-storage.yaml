# The Barman Cloud Plugin's ObjectStore CRD, pointing at OVH's S3-compatible Object Storage
# (research.md §6). Credentials come from contracts/secrets-schema.md's S3_ACCESS_KEY/S3_SECRET_KEY,
# decrypted from secrets.sops.yaml at deploy time — never hardcoded here.
#
# Bucket `jordylab-cnpg-backups` in OVH Gravelines (GRA, 1-AZ Standard), deliberately a different
# site than the London VPS so a datacenter loss doesn't take the backups with it (docs/runbook.md §8).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: ovh-object-storage
spec:
  configuration:
    destinationPath: s3://jordylab-cnpg-backups/cnpg-backups
    endpointURL: https://s3.gra.io.cloud.ovh.net
    s3Credentials:
      accessKeyId:
        name: jordylab-secrets
        key: S3_ACCESS_KEY
      secretAccessKey:
        name: jordylab-secrets
        key: S3_SECRET_KEY
    wal:
      compression: gzip
  # The only retention that is actually enforced: base backups and WAL older than what's needed to
  # restore to any point in the last 30 days are deleted. CNPG ScheduledBackups have no per-schedule
  # "keep N" setting, so the daily/weekly schedules below only control how often a base backup is taken.
  retentionPolicy: 30d
---
# Daily base backup (FR-014). Retention is the ObjectStore's 30d policy above, not a per-schedule count.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cnpg-daily-backup
spec:
  # CNPG uses 6-field cron with SECONDS first (sec min hour dom month dow), evaluated in UTC.
  schedule: "0 0 3 * * *" # 03:00 UTC daily
  backupOwnerReference: self
  cluster:
    name: cnpg-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
# Weekly base backup (FR-014). Redundant with the daily one under a 30d policy; kept as an extra
# restore anchor. Retention is the ObjectStore's 30d policy above.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cnpg-weekly-backup
spec:
  schedule: "0 0 4 * * 0" # 04:00 UTC every Sunday (6-field cron, seconds first)
  backupOwnerReference: self
  cluster:
    name: cnpg-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
