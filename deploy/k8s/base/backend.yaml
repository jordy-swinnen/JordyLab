apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/jordy-swinnen/jordylab-backend:placeholder
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            # DB login comes from the same basic-auth Secret CNPG uses to create the `jordylab` owner,
            # so the password lives in exactly one place (secrets.sops.yaml → jordylab-db-app).
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: jordylab-db-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jordylab-db-app
                  key: password
            # The backend reads KEYCLOAK_BACKEND_SECRET (application.yaml); the Secret key is named
            # after the Keycloak client it belongs to, and is shared with Keycloak's realm import.
            - name: KEYCLOAK_BACKEND_SECRET
              valueFrom:
                secretKeyRef:
                  name: jordylab-secrets
                  key: KEYCLOAK_BACKEND_CLIENT_SECRET
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: jordylab-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: artwork
              mountPath: /var/jordylab/artwork
            - name: mobile-releases
              mountPath: /var/jordylab/mobile-releases
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
      volumes:
        - name: artwork
          persistentVolumeClaim:
            claimName: gamecatalog-artwork
        - name: mobile-releases
          persistentVolumeClaim:
            claimName: mobile-releases
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
