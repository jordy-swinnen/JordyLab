apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/jordy-swinnen/jordylab-backend:placeholder
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            # DB login comes from the same basic-auth Secret CNPG uses to create the `jordylab` owner,
            # so the password lives in exactly one place (secrets.sops.yaml → jordylab-db-app).
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: jordylab-db-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jordylab-db-app
                  key: password
            # The first admin on a fresh database (spec 019 D9); ignored once any account exists, never logged.
            # Optional so a migrated database (release B) needs no re-key to roll out; keep both keys in
            # jordylab-secrets for a disaster-recovery rebuild.
            - name: IDENTITY_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: jordylab-secrets
                  key: IDENTITY_BOOTSTRAP_ADMIN_USERNAME
                  optional: true
            - name: IDENTITY_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jordylab-secrets
                  key: IDENTITY_BOOTSTRAP_ADMIN_PASSWORD
                  optional: true
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: jordylab-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          # A cold start can take ~70 s (FNA ingestion plus the ArchUnit scan). Without a startup probe the liveness
          # probe killed the first container at 75 s during the v0.0.1-rc32 deploy (JOR-76). Liveness and readiness stay
          # disabled until this succeeds; 30 x 5 s allows 150 s.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: artwork
              mountPath: /var/jordylab/artwork
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
      volumes:
        - name: artwork
          persistentVolumeClaim:
            claimName: gamecatalog-artwork
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
