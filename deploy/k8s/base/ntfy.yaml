# Self-hosted ntfy for mobile app (spec 007) push notifications — resolved in /speckit-clarify:
# in-cluster, not the public ntfy.sh service (FR-013). Runs from ntfy's own upstream image, not
# built by this repo's CI (spec.md Key Entities).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  labels:
    app: ntfy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:latest # pin an exact tag at implementation time, never `latest` in prod
          args: ["serve"]
          ports:
            - name: http
              containerPort: 80
          env:
            - name: NTFY_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: NTFY_BASE_URL
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: ntfy-cache
              mountPath: /var/cache/ntfy
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: ntfy-cache
          persistentVolumeClaim:
            claimName: ntfy-cache
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
spec:
  selector:
    app: ntfy
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ntfy-cache
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
