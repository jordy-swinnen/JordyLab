# Gateway API resources for the public routing table (contracts/http-routing.md).
# Traefik (k3s's bundled ingress) is the Gateway implementation — see
# deploy/host/traefik-helmchartconfig.yaml for enabling its Gateway API provider.
#
# Listener ports are Traefik's *internal* entryPoint ports (k3s: web=:8000, websecure=:8443), not the
# public 80/443 — Traefik's Gateway provider matches listeners to entryPoints by that port, and the
# traefik Service maps public 80/443 onto them. Using 80/443 here gives
# "Cannot find entryPoint for Gateway: no matching entryPoint for port 80".
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: jordylab-gateway
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - name: jordylab-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
spec:
  parentRefs:
    - name: jordylab-gateway
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-route
spec:
  parentRefs:
    - name: jordylab-gateway
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend
          port: 8080
    - matches:
        - path:
            type: Exact
            value: /.well-known/assetlinks.json
      backendRefs:
        - name: backend
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-route
spec:
  parentRefs:
    - name: jordylab-gateway
      sectionName: https
  rules:
    # Only Keycloak's public endpoints — never /auth/admin, the management port or the `master` realm
    # (FR-009, contracts/http-routing.md, spec 011 BUG-022). Deliberately no catch-all /auth prefix rule.
    # PathPrefix matches whole segments: /auth/realms/jordylab covers /auth/realms/jordylab/** only, so
    # /auth/realms/master (the Keycloak admin's login + token endpoint) falls through to the SPA.
    # Administer Keycloak via `kubectl port-forward` or kcadm inside the pod (docs/runbook.md).
    - matches:
        - path:
            type: PathPrefix
            value: /auth/realms/jordylab
      backendRefs:
        - name: keycloak
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /auth/resources
      backendRefs:
        - name: keycloak
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /auth/.well-known
      backendRefs:
        - name: keycloak
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ntfy-route
spec:
  parentRefs:
    - name: jordylab-gateway
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ntfy
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: ntfy
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
spec:
  parentRefs:
    - name: jordylab-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
