# Production overlay, applied by CI (.github/workflows/deploy-prod.yml) with the namespace-scoped
# ci-deploy token. Everything here is namespaced; cluster-scoped setup (Namespace, ClusterIssuers,
# CI RBAC) lives in deploy/k8s/bootstrap and is applied once by Jordy (docs/runbook.md §9).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jordylab

resources:
  - ../../base
  - ../../cluster
  - secrets.sops.yaml

images:
  - name: ghcr.io/jordy-swinnen/jordylab-backend
    newTag: placeholder # set by `kustomize edit set image` in deploy-prod.yml, per the deployed commit SHA
  - name: ghcr.io/jordy-swinnen/jordylab-frontend
    newTag: placeholder
  - name: ghcr.io/jordy-swinnen/jordylab-keycloak
    newTag: placeholder

configMapGenerator:
  - name: backend-config
    literals:
      - POSTGRES_URL=jdbc:postgresql://cnpg-cluster-rw:5432/jordylab
      - KEYCLOAK_URL=https://jordylab.be/auth
      # In-cluster Service for the backend's Keycloak Admin REST calls (/auth/admin is not public).
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080/auth
      - JORDYLAB_CORS_ALLOWED_ORIGINS=https://jordylab.be,https://localhost
      - MOBILE_PRODUCTION_DOMAIN=jordylab.be
      # Android app id (permanent once released) and the release certificate's SHA-256 as plain hex — both
      # public; served in /.well-known/assetlinks.json and checked against every published APK (spec 007).
      - MOBILE_APPLICATION_ID=be.jordylab.app
      - MOBILE_RELEASE_SIGNING_CERT_SHA256=1B0213851EAAA2D4069080AB548524EE08B038F545F91891A51C929D47DD77E8
      - NTFY_BASE_URL=https://jordylab.be/ntfy
      # No API docs in prod: SpringDoc's defaults serve /v3/api-docs and /swagger-ui.html (spec 011 BUG-046).
      - SPRINGDOC_API_DOCS_ENABLED=false
      - SPRINGDOC_SWAGGER_UI_ENABLED=false
  - name: keycloak-config
    literals:
      - KC_HOSTNAME=https://jordylab.be/auth
      - KC_HTTP_RELATIVE_PATH=/auth # must match the value baked into the image (Containerfile)
      # KC_HTTP_MANAGEMENT_RELATIVE_PATH=/ is baked into the image (Containerfile); setting it here
      # differently would stop `start --optimized`.
      - KC_PROXY_HEADERS=xforwarded
      # TLS is terminated at Traefik; Keycloak itself serves plain HTTP inside the cluster.
      - KC_HTTP_ENABLED=true
      # Only trust X-Forwarded-* headers from inside the cluster: k3s's default pod CIDR, where the
      # Traefik pod lives (its IP changes on restart, so a single IP would break).
      - KC_PROXY_TRUSTED_ADDRESSES=10.42.0.0/16
      # Used by realm-prod.json's ${PRODUCTION_DOMAIN} placeholders on the first-boot import.
      - PRODUCTION_DOMAIN=jordylab.be

patches:
  - target:
      kind: Certificate
      name: jordylab-tls
    patch: |-
      - op: replace
        path: /spec/dnsNames/0
        value: jordylab.be
