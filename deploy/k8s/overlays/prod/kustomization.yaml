# The k3s production overlay. Since the Compose cutover (spec 020) nothing applies it: k3s is stopped and
# this tree is kept only for the rebuild path (spec 020, the R14 decision). Everything here is namespaced;
# cluster-scoped setup (Namespace, ClusterIssuers, CI RBAC) lives in deploy/k8s/bootstrap and was applied
# once by Jordy (docs/runbook.md §9).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jordylab

resources:
  - ../../base
  - ../../cluster
  - secrets.sops.yaml

images:
  - name: ghcr.io/jordy-swinnen/jordylab-backend
    newTag: placeholder # was set by `kustomize edit set image` in the retired k3s deploy workflow
  - name: ghcr.io/jordy-swinnen/jordylab-frontend
    newTag: placeholder

configMapGenerator:
  - name: backend-config
    literals:
      - POSTGRES_URL=jdbc:postgresql://cnpg-cluster-rw:5432/jordylab
      - JORDYLAB_CORS_ALLOWED_ORIGINS=https://jordylab.be,https://localhost
      - NTFY_BASE_URL=https://jordylab.be/ntfy
      # Admin push click-throughs open the web app on this origin (spec 018 US3).
      - JORDYLAB_APP_BASE_URL=https://jordylab.be
      # AI traces go to Langfuse Cloud (EU); keys and base URL are in jordylab-secrets.
      - LANGFUSE_ENVIRONMENT=production
      # Jordy's call (2026-11-01): prod traces carry prompts and answers.
      - LANGFUSE_CAPTURE_CONTENT=true
      # No API docs in prod: SpringDoc's defaults serve /v3/api-docs and /swagger-ui.html (spec 011 BUG-046).
      - SPRINGDOC_API_DOCS_ENABLED=false
      - SPRINGDOC_SWAGGER_UI_ENABLED=false

patches:
  - target:
      kind: Certificate
      name: jordylab-tls
    patch: |-
      - op: replace
        path: /spec/dnsNames/0
        value: jordylab.be
